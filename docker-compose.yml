version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"

  order-service:
    build: ./order-service
    ports:
      - "5001:5001"
    depends_on:
      - rabbitmq

  notification-service:
    build: ./notification-service
    depends_on:
      - rabbitmq

  gateway:
    build: ./gateway
    ports:
      - "5000:5000"
    depends_on:
      - order-service