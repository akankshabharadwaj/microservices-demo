version: '3.8'

services:
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-orders}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-orders-demo-only}
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  order-service:
    build: ./order-service
    ports:
      - "5001:5001"
    environment:
      RABBITMQ_USER: ${RABBITMQ_USER:-orders}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-orders-demo-only}
    depends_on:
      rabbitmq:
        condition: service_healthy

  notification-service:
    build: ./notification-service
    environment:
      RABBITMQ_USER: ${RABBITMQ_USER:-orders}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-orders-demo-only}
    depends_on:
      rabbitmq:
        condition: service_healthy

  gateway:
    build: ./gateway
    ports:
      - "5000:5000"
    depends_on:
      - order-service